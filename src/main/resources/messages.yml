bounty-placed: "<green>You placed a bounty of <yellow>$%amount%</yellow> on <aqua>%player%</aqua></green>"
claimed: "<gold>You claimed <yellow>$%amount%</yellow> bounty!</gold>"

global:
  bounty-placed: "<green>A bounty of <yellow>$%amount%</yellow> has been put on <aqua>%player%</aqua>."
  claimed-global: "<gold>%player% <green>has claimed a bounty of <yellow>$%amount%</yellow>."

errors:
  self-bounty: "<red>You can't place a bounty on yourself!</red>"
  player-not-found: "<red>Player not found!</red>"
  not-enough-money: "<red>You don't have enough money!</red>"
  invalid-cmd: "<red>Invalid command argument!"
  bounty-too-low: "<red>Minimum bounty is <yellow>%min%</yellow>"
  bounty-too-high: "<red>Maximum bounty is <yellow>%max%</yellow>"
  invalid-amount: "<red>Invalid number!"
  negative-amount: "<red>Amount cannot be 0 or negative!"

gui:
  title: "ʙᴏᴜɴᴛɪᴇꜱ (Page %currentpage%)"
  player-head:
    item-name: "<#008BFF>%player%"
    lore:
      - "<white>Bounty: <gray>$%amount%</gray>"
  info-item:
    item: NETHER_STAR
    slot: 49
    item-name: "<#008BFF>ʙᴏᴜɴᴛɪᴇꜱ"
    lore:
      - "<white>Click to refresh"
      - ""
      - "<gray>Set a bounty on someone using this:"
      - "<gray>/bounty add (player) (amount)"
  search-item:
    item: OAK_SIGN
    slot: 50
    item-name: "<#008BFF>ꜱᴇᴀʀᴄʜ"
    lore:
      - "<white>Click to search"
      - ""
      - "<gray>Currently searching for:"
      - "<gray>%whoisthis%"
  sort-item:
    item: HOPPER
    slot: 48
    item-name: "<#008BFF>ꜱᴏʀᴛ"
    lore:
      - "<white>Click to sort"
      - ""
      - "<gray>Current sorting:"
      - "<gray>%sorting%"
  next-page-item:
    item: ARROW
    slot: 53
    item-name: "<#008BFF>ɴᴇxᴛ ᴘᴀɢᴇ"
    lore:
      - "<white>Click to next page"
      - ""
      - "<gray>Current page: <white>%currentpage%"
  back-item:
    item: ARROW
    slot: 45
    item-name: "<#008BFF>ʙᴀᴄᴋ"
    lore:
      - "<white>Click to go to the previous page"